ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.ecotrace.backend.ApplicationKt.module ]
    }
}

cors {
    allowedHosts = "localhost:8080"
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

storage {
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIR}
    maxFileSizeBytes = 10485760
    maxFileSizeBytes = ${?MAX_UPLOAD_BYTES}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "ecotrace"
    audience = "ecotrace-users"
    realm = "EcoTrace API"
    expiresInMs = 86400000  # 24 hours
}

database {
    url = "jdbc:postgresql://localhost:5432/ecotrace"
    url = ${?DATABASE_URL}
    user = "ecotrace"
    user = ${?DATABASE_USER}
    password = ${DATABASE_PASSWORD}
    driver = "org.postgresql.Driver"
    maxPoolSize = 10
}
